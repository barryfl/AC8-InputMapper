; Experimental X56 translation, based on the known-good VIRPIL regression assignments; synthetic GUIDs.
; Button1 = button 1 in joy.cpl, not zero-based index 1.
; Axis tokens: X Y Z Rx Ry Rz. A minus sign reverses.
; Restart AC8 after editing. None disables a binding.
; Stock menu/combat aliases remain: Gun also confirms, MSL also backs out.
