; AC8 InputMapper configuration - Version 1
; Copy each device's InstanceGUID from List-Controllers.exe.
; Set Enabled=1 only after replacing BOTH GUID placeholders.
; Button1 means physical button 1. Prefix an axis with '-' to reverse it.
; Use only available X/Y/Z/Rx/Ry/Rz axes. None disables an assignment.
; Restart the game after editing. Offline single-player only.
[Compatibility]
Version=1
Enabled=0

[Stick]
InstanceGUID={REPLACE-WITH-STICK-INSTANCE-GUID}

[Throttle]
InstanceGUID={REPLACE-WITH-THROTTLE-INSTANCE-GUID}

[Stick.Bindings]
Gun=None
MSL=None
Weapon=None
Target=None
View=None
DPadUp=None
DPadRight=None
DPadDown=None
DPadLeft=None
Pitch=None
Roll=None
Yaw=None
CameraPitch=None
CameraYaw=None

[Throttle.Bindings]
Radar=None
Flare=None
AutoPilot=None
Pause=None
Throttle=None
