; Version 2: two game-facing anchors plus optional additional devices.
; Copy each device's InstanceGUID from List-Controllers.exe.
; Set Enabled=1 only after replacing BOTH GUID placeholders.
; Button1 means joy.cpl button 1. Prefix an axis with '-' to reverse it.
; Use only available X/Y/Z/Rx/Ry/Rz axes. None disables an assignment.
; Restart the game after editing. Offline single-player only.
[Compatibility]
Version=2
Enabled=0

[Stick]
InstanceGUID={REPLACE-WITH-STICK-INSTANCE-GUID}

[Throttle]
InstanceGUID={REPLACE-WITH-THROTTLE-INSTANCE-GUID}

[Stick.Bindings]
Gun=None
MSL=None
Weapon=None
Target=None
View=None
DPadUp=None
DPadRight=None
DPadDown=None
DPadLeft=None
Pitch=None
Roll=None
Yaw=None
CameraPitch=None
CameraYaw=None

[Throttle.Bindings]
Radar=None
Flare=None
AutoPilot=None
Pause=None
Throttle=None

; OPTIONAL ADDITIONAL DEVICE: remove semicolons and enter a real InstanceGUID.
; Move Yaw by setting Yaw=None in [Stick.Bindings] above; keep action=axis syntax.
; [Device.Pedals]
; InstanceGUID={REPLACE-WITH-PEDALS-INSTANCE-GUID}
; [Device.Pedals.Bindings]
; Yaw=Z
; See MULTI-DEVICE.txt. Do not use the same GUID as Stick or Throttle.
